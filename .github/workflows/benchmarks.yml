name: Benchmarks

# Manual only: benchmark runs are long and shared runners are noisy, so results are indicative.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated total resource versions to seed (e.g. 10000,100000,1000000)
        required: true
        default: "10000,100000"
      filter:
        description: BenchmarkDotNet --filter glob
        required: true
        default: "*"
      job:
        description: BenchmarkDotNet job (short, medium, default)
        required: true
        default: short

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run
        env:
          ASTER_BENCH_VERSIONS: ${{ inputs.versions }}
          BENCH_FILTER: ${{ inputs.filter }}
          BENCH_JOB: ${{ inputs.job }}
        run: >
          dotnet run --configuration Release --project bench/Aster.Benchmarks --
          --filter "$BENCH_FILTER" --job "$BENCH_JOB"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: error
