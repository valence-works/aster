name: Release

# Publishes the packable libraries to nuget.org when a version tag (v1.2.3, v0.2.0-preview.1) is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # nuget.org versions are permanent, so reject anything that is not strict SemVer (MAJOR.MINOR.PATCH[-pre][+build]).
      - name: Resolve version
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a SemVer release tag (expected v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          dotnet build Aster.sln --configuration Release -p:Version="$VERSION"
          dotnet test Aster.sln --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/core/Aster.Core/Aster.Core.csproj --configuration Release --no-build --output artifacts -p:Version="$VERSION"
          dotnet pack src/persistence/Aster.Persistence.SqliteJson/Aster.Persistence.SqliteJson.csproj --configuration Release --no-build --output artifacts -p:Version="$VERSION"
          dotnet pack src/persistence/Aster.Persistence.PostgresJsonb/Aster.Persistence.PostgresJsonb.csproj --configuration Release --no-build --output artifacts -p:Version="$VERSION"
          dotnet pack src/persistence/Aster.Persistence.SqlServerJson/Aster.Persistence.SqlServerJson.csproj --configuration Release --no-build --output artifacts -p:Version="$VERSION"
          dotnet pack src/hosting/Aster.AspNetCore/Aster.AspNetCore.csproj --configuration Release --no-build --output artifacts -p:Version="$VERSION"

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
