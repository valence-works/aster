name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  dotnet:
    name: Build and test (.NET 8 / 9 / 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Postgres provider tests (#97) run against this server; ASTER_REQUIRE_POSTGRES makes them fail rather
    # than skip if it is missing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Aster.sln

      - name: Build
        run: dotnet build Aster.sln --configuration Release --no-restore

      - name: Test
        env:
          ASTER_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
          ASTER_REQUIRE_POSTGRES: "1"
        run: >
          dotnet test Aster.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Pack
        run: |
          dotnet pack src/core/Aster.Core/Aster.Core.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/persistence/Aster.Persistence.SqliteJson/Aster.Persistence.SqliteJson.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/persistence/Aster.Persistence.PostgresJsonb/Aster.Persistence.PostgresJsonb.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/hosting/Aster.AspNetCore/Aster.AspNetCore.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/integrations/Aster.Elsa/Aster.Elsa.csproj --configuration Release --no-build --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  studio-spa:
    name: Build Aster Studio SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/apps/Aster.Studio/ClientApp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/apps/Aster.Studio/ClientApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

  studio-e2e:
    name: Aster Studio Playwright smoke
    # Pinned: Playwright 1.56 can't install its browser dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/apps/Aster.Studio/ClientApp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/apps/Aster.Studio/ClientApp/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install
        run: npm ci

      - name: Build SPA
        run: npm run build

      - name: Build Studio host
        working-directory: .
        run: dotnet build src/apps/Aster.Studio/Aster.Studio.csproj

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the Studio host on a fresh SQLite database and drives the core flows headless.
      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/apps/Aster.Studio/ClientApp/playwright-report
            src/apps/Aster.Studio/ClientApp/test-results
          if-no-files-found: ignore
